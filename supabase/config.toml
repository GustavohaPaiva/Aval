# Secrets (não versionar): SERVICE_ROLE já disponível no runtime das functions.

[functions.melhorar-texto-proposta]
verify_jwt = true

[functions.criar-link-assinatura]
verify_jwt = true

[functions.obter-assinatura]
verify_jwt = false

[functions.concluir-assinatura]
verify_jwt = false

[functions.enviar-push-notificacao]
# A função autentica sozinha: JWT do usuário na chave pública e
# PUSH_DISPATCH_KEY no disparo do banco. O gateway rejeitaria essa chave.
verify_jwt = false
