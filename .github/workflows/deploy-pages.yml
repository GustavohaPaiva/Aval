name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve public URL / base path
        id: app_env
        run: |
          APP_URL="${{ vars.VITE_APP_URL }}"
          BASE_PATH="${{ vars.VITE_BASE_PATH }}"
          EMAIL_DOMAIN="${{ vars.VITE_AUTH_EMAIL_DOMAIN }}"

          if [ -z "$APP_URL" ]; then
            APP_URL="https://aval-fertilizantes.online"
          fi
          if [ -z "$BASE_PATH" ]; then
            BASE_PATH="/"
          fi
          if [ -z "$EMAIL_DOMAIN" ]; then
            EMAIL_DOMAIN="syagri.com.br"
          fi

          # Garante barra inicial e final no base path
          case "$BASE_PATH" in
            /*) ;;
            *) BASE_PATH="/$BASE_PATH" ;;
          esac
          case "$BASE_PATH" in
            */) ;;
            *) BASE_PATH="$BASE_PATH/" ;;
          esac

          echo "app_url=$APP_URL" >> "$GITHUB_OUTPUT"
          echo "base_path=$BASE_PATH" >> "$GITHUB_OUTPUT"
          echo "email_domain=$EMAIL_DOMAIN" >> "$GITHUB_OUTPUT"
          echo "Deploy config: APP_URL=$APP_URL BASE_PATH=$BASE_PATH EMAIL_DOMAIN=$EMAIL_DOMAIN"

      - name: Build for GitHub Pages
        run: npm run build:pages
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_URL: ${{ steps.app_env.outputs.app_url }}
          VITE_BASE_PATH: ${{ steps.app_env.outputs.base_path }}
          VITE_AUTH_EMAIL_DOMAIN: ${{ steps.app_env.outputs.email_domain }}
          # Não injeta VITE_GEMINI_API_KEY no build do Pages: a chave entra no JS
          # e o GitHub Push Protection bloqueia o push em gh-pages.
          VITE_GEMINI_MODEL: ${{ vars.VITE_GEMINI_MODEL }}

      - name: Verify build output
        env:
          BASE_PATH: ${{ steps.app_env.outputs.base_path }}
          APP_URL: ${{ steps.app_env.outputs.app_url }}
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/.nojekyll
          test -d dist/assets
          if grep -q '/src/main.jsx' dist/index.html; then
            echo 'Build inválido: index.html ainda aponta para /src/main.jsx'
            exit 1
          fi
          # BASE_PATH=/ → assets em /assets/; caso contrário /Syagri/assets/ etc.
          if [ "$BASE_PATH" = "/" ]; then
            ASSET_MARKER='/assets/'
          else
            ASSET_MARKER="${BASE_PATH}assets/"
          fi
          if ! grep -q "$ASSET_MARKER" dist/index.html; then
            echo "Build inválido: assets não usam base $BASE_PATH (esperado $ASSET_MARKER)"
            exit 1
          fi
          if ! grep -q "og:url" dist/index.html; then
            echo "Aviso: og:url ausente (VITE_APP_URL=$APP_URL)"
          fi

      - name: Upload artifact (GitHub Actions Pages)
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true

  # Opcional: só funciona se Settings → Pages → Source = "GitHub Actions".
  # A branch gh-pages (passo peaceiris acima) já publica o site sozinha.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ vars.VITE_APP_URL || 'https://aval-fertilizantes.online' }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
